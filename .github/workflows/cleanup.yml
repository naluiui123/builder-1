name: cleanup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete expired artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const octokit = github.getOctokit(process.env.GITHUB_TOKEN);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const artifact of await octokit.paginate(octokit.rest.actions.listArtifactsForRepo, { owner, repo })) {
              const created = new Date(artifact.created_at);
              const ageDays = (Date.now() - created.getTime()) / 86400000;
              if (artifact.expired || ageDays > 14) {
                try {
                  await octokit.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                  console.log(`deleted ${artifact.name}`);
                } catch (e) {
                  console.warn(`skip ${artifact.name}: ${e.message}`);
                }
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
